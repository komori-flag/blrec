name: Linux portable

on:
  push:
    tags:
      - v*.*.*
  workflow_dispatch:

jobs:

  build:
    name: Build Linux x64 portable distributions
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Build webapp
        working-directory: webapp
        run: |
          npm install
          npm run build

      - name: Setup Python 3.11 (from deadsnakes PPA for GLIBC compatibility)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends software-properties-common
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt-get install -y --no-install-recommends python3.11 python3.11-dev python3.11-venv
          sudo python3.11 -m ensurepip
          sudo python3.11 -m pip install --upgrade pip
          echo "Python 3.11 location: $(which python3.11)"
          ldd $(python3.11 -c "import sys; print(sys.path[-1] + '/libpython3.11.so')") 2>/dev/null | grep glibc || true

      - name: Install Python packages
        run: |
          python3.11 -m pip install .
          python3.11 -m pip install pyinstaller

      - name: Download ffmpeg archive
        run: |
          # Use GitHub API to get the exact download URL for the linux64 lgpl-static build
          DOWNLOAD_URL=$(curl -sL https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/latest | jq -r '.assets[] | select(.name == "ffmpeg-master-latest-linux64-lgpl.tar.xz") | .browser_download_url')
          echo "Downloading from: $DOWNLOAD_URL"
          curl -L --retry 3 --retry-delay 5 "$DOWNLOAD_URL" -o ffmpeg.tar.xz
          file ffmpeg.tar.xz

      - name: Unpack ffmpeg archive
        run: |
          mkdir -p build/ffmpeg
          tar -xJf ffmpeg.tar.xz -C build/
          # Rename the extracted directory to a fixed name
          mv build/ffmpeg-master-* build/ffmpeg-tmp
          # Only copy bin/ (the static binaries, no shared libs needed)
          mkdir -p build/ffmpeg/bin
          cp build/ffmpeg-tmp/bin/ffmpeg build/ffmpeg/bin/
          cp build/ffmpeg-tmp/bin/ffprobe build/ffmpeg/bin/
          ls -lh build/ffmpeg/bin/

      - name: Prepare build directory
        run: |
          mkdir -p dist

      - name: Build standalone executable with PyInstaller
        run: |
          python3.11 -m PyInstaller --onedir \
            --name blrec \
            --add-data "src/blrec/data/webapp:blrec/data/webapp" \
            --hidden-import blrec \
            --collect-all blrec \
            --collect-data blrec \
            pyinstaller_entry.py

      - name: Bundle ffmpeg with the build
        run: |
          cp -r build/ffmpeg dist/blrec/
          # Create a portable run script
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            '#' \
            '# Bilibili Live Streaming Recorder (blrec) 便携版' \
            '# =============================================' \
            '#' \
            '# 主机和端口绑定，可以按需修改。' \
            '# 关于 api key:' \
            '#   api key 可以使用数字和字母，长度限制为最短 8 最长 80。' \
            '#   3 次尝试内 api key 正确客户端 ip 会自动加入白名单，' \
            '#   3 次错误后则 ip 会被加入黑名单，黑名单后请求会被拒绝 (403)。' \
            '#   请自行修改 api key，不要使用默认的 api key。' \
            '#' \
            '# 首次运行会自动生成默认配置文件。' \
            '' \
            'SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"' \
            'export PATH="$SCRIPT_DIR/ffmpeg/bin:$PATH"' \
            '' \
            'export no_proxy="*"' \
            '' \
            'HOST="0.0.0.0"' \
            'PORT=2233' \
            'API_KEY="bili2233"' \
            '' \
            'export BLREC_DEFAULT_LOG_DIR="${SCRIPT_DIR}/日志文件"' \
            'export BLREC_DEFAULT_OUT_DIR="${SCRIPT_DIR}/录播文件"' \
            '' \
            'exec "$SCRIPT_DIR/blrec" -c "${SCRIPT_DIR}/settings.toml" --host "$HOST" --port "$PORT" --api-key "$API_KEY" --ipv4 "$@"' \
            > dist/blrec/run.sh
          chmod +x dist/blrec/run.sh

      - name: Verify build
        run: |
          ls -lh dist/blrec/blrec
          file dist/blrec/blrec
          dist/blrec/blrec --help || true

      - name: Create tar archive
        run: |
          cd dist
          tar -czf "blrec-${{ github.ref_name }}-linux64.tar.gz" blrec/
          ls -lh "blrec-${{ github.ref_name }}-linux64.tar.gz"

      - name: Upload distributions to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/*.tar.gz
          tag: ${{ github.ref }}
          overwrite: true
          file_glob: true
