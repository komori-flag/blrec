services:
  blrec:
    build:
      context: .
      args:
        # 使用国内镜像源加速构建（清华 apt 镜像 + 阿里云 PyPI 镜像）
        - USE_MIRRORS=true
        - APT_MIRROR=mirrors.tuna.tsinghua.edu.cn
        - PIP_INDEX_URL=https://repo.huaweicloud.com/repository/pypi/simple/
    container_name: blrec
    restart: unless-stopped
    ports:
      - "2233:2233"
    volumes:
      # 配置文件目录（首次运行会自动生成 default settings.toml）
      - ./cfg:/cfg
      # 日志文件目录
      - ./log:/log
      # 录播文件存储目录
      - ./rec:/rec
    environment:
      # 时区设置
      - TZ=Asia/Shanghai
      # API key（可选，建议修改）
      # - BLREC_API_KEY=your_api_key_here
      # 仅 IPv4（可选）
      # - BLREC_IPV4=1
